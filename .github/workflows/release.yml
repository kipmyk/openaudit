name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 0.1.0-alpha.0)'
        required: false
        default: '0.1.0-alpha.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package-linux:
    name: Package Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Debian 12 baseline packaging container
        run: docker build -f docker/debian-12.Dockerfile -t openaudit-ci:debian-12 .

      - name: Run workspace tests in Debian 12 baseline environment
        run: docker run --rm -v "$(pwd):/workspace" -w /workspace openaudit-ci:debian-12 bash -c "cargo test --verbose"

      - name: Build release packages in Debian 12 container
        run: docker run --rm -v "$(pwd):/workspace" -w /workspace openaudit-ci:debian-12 bash -c "./scripts/package-release.sh"

      - name: Test clean installation on pristine Ubuntu 24.04, Debian 12 and Debian 13
        run: ./scripts/test-clean-install.sh

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: openaudit-linux-x86_64
          path: |
            artifacts/packages/*.deb
            artifacts/packages/*linux*.tar.gz
            artifacts/packages/SHA256SUMS

  package-macos:
    name: Package macOS (Apple Silicon / aarch64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run core and engine test suite on native macOS runner
        run: |
          cargo test -p openaudit-core --lib -- --skip tpm
          cargo test -p openaudit-engine --verbose

      - name: Build and package portable bundle and macOS .app bundle
        run: |
          ./scripts/package-release.sh
          ./scripts/package-macos-app.sh

      - name: Verify clean CLI execution and standalone HTML report
        run: |
          ./target/release/openaudit-cli version
          ./target/release/openaudit-cli scan --format human
          ./target/release/openaudit-cli report --format html --output /tmp/test-report.html
          test -s /tmp/test-report.html

      - name: Upload macOS Packages
        uses: actions/upload-artifact@v4
        with:
          name: openaudit-macos-aarch64
          path: |
            artifacts/packages/*darwin*.tar.gz
            artifacts/packages/OpenAudit*.zip
            artifacts/packages/SHA256SUMS

  package-windows:
    name: Package Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run core and engine test suite on native Windows runner
        shell: pwsh
        run: |
          cargo test -p openaudit-core --lib -- --skip tpm
          cargo test -p openaudit-engine --verbose

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Assemble Windows portable package
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || '0.1.0-alpha.0' }}"
          $distDir = "artifacts/packages"
          $stage = "$distDir/openaudit-$ver-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/bin", "$stage/docs", "$stage/scripts"

          Copy-Item target/release/openaudit-cli.exe "$stage/bin/openaudit-cli.exe"
          Copy-Item target/release/openaudit-cli.exe "$stage/bin/openaudit.exe"
          if (Test-Path target/release/openaudit-agent.exe) {
              Copy-Item target/release/openaudit-agent.exe "$stage/bin/openaudit-agent.exe"
          }
          if (Test-Path target/release/openaudit-server.exe) {
              Copy-Item target/release/openaudit-server.exe "$stage/bin/openaudit-server.exe"
          }

          Copy-Item LICENSE "$stage/"
          Copy-Item README.md "$stage/"
          Copy-Item docs/PACKAGING-AND-DISTRIBUTION.md "$stage/docs/"
          Copy-Item packaging/windows/*.ps1 "$stage/scripts/"

          Compress-Archive -Path "$stage/*" -DestinationPath "$distDir/openaudit-$ver-windows-x86_64.zip" -Force
          Get-FileHash "$distDir/openaudit-$ver-windows-x86_64.zip" -Algorithm SHA256 | Out-File -FilePath "$distDir/SHA256SUMS-windows.txt"

      - name: Test Windows CLI execution and HTML report generation
        shell: pwsh
        run: |
          ./target/release/openaudit-cli.exe version
          ./target/release/openaudit-cli.exe scan --format human
          ./target/release/openaudit-cli.exe report --format html --output ./test-report.html
          if (-not (Test-Path ./test-report.html)) { throw "HTML report not generated!" }

      - name: Test Windows Service installation and uninstallation scripts
        shell: pwsh
        run: |
          # Test installation
          powershell -ExecutionPolicy Bypass -File packaging/windows/install-service.ps1 -InstallDir "target/release"
          $svc = Get-Service -Name "OpenAuditAgent"
          if ($svc.Status -ne "Running") { throw "OpenAuditAgent service is not running!" }

          # Test uninstallation
          powershell -ExecutionPolicy Bypass -File packaging/windows/uninstall-service.ps1
          $svcCheck = Get-Service -Name "OpenAuditAgent" -ErrorAction SilentlyContinue
          if ($svcCheck) { throw "OpenAuditAgent service was not properly removed!" }

      - name: Upload Windows Packages
        uses: actions/upload-artifact@v4
        with:
          name: openaudit-windows-x86_64
          path: |
            artifacts/packages/*.zip
            artifacts/packages/SHA256SUMS-windows.txt
