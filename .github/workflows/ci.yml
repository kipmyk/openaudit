name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and verify formatting in Ubuntu 24.04 container
        run: ./scripts/ci-local.sh fmt

  clippy:
    name: Clippy Linter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Clippy in Ubuntu 24.04 container
        run: ./scripts/ci-local.sh clippy

  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run workspace binaries build and tests in Ubuntu 24.04 container
        run: |
          ./scripts/ci-local.sh build
          ./scripts/ci-local.sh test

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify documentation in Ubuntu 24.04 container
        run: ./scripts/ci-local.sh doc

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-audit in Ubuntu 24.04 container
        run: ./scripts/ci-local.sh audit

  multi-distro:
    name: Multi-Distribution Verification (Debian 12 & 13)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Ubuntu 24.04, Debian 12 and 13 verification containers
        run: |
          docker build -f docker/ci.Dockerfile -t openaudit-ci:ubuntu-24.04 .
          docker build -f docker/debian-12.Dockerfile -t openaudit-ci:debian-12 .
          docker build -f docker/debian-13.Dockerfile -t openaudit-ci:debian-13 .

      - name: Run multi-distribution test runner
        run: ./scripts/test-distros.sh

  windows-native:
    name: Windows Native Verification
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Compile and run engine, core, and CLI test suite on native Windows
        run: |
          cargo test -p openaudit-core --lib -- --skip tpm
          cargo test -p openaudit-engine --verbose
          cargo test -p openaudit-cli --verbose

  macos-native:
    name: macOS Native Verification
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Compile and run engine, core, and CLI test suite on native macOS
        run: |
          cargo test -p openaudit-core --lib -- --skip tpm
          cargo test -p openaudit-engine --verbose
          cargo test -p openaudit-cli --verbose
