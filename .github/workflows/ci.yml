name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and verify formatting in Ubuntu 24.04 container
        run: ./scripts/ci-local.sh fmt

  clippy:
    name: Clippy Linter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Clippy in Ubuntu 24.04 container
        run: ./scripts/ci-local.sh clippy

  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run workspace binaries build and tests in Ubuntu 24.04 container
        run: |
          ./scripts/ci-local.sh build
          ./scripts/ci-local.sh test

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify documentation in Ubuntu 24.04 container
        run: ./scripts/ci-local.sh doc

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-audit in Ubuntu 24.04 container
        run: ./scripts/ci-local.sh audit
