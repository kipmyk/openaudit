# OpenAudit Self-Hosted Control Plane Deployment
# Milestone 8: Reproducible Self-Hosted Production-Ready Stack

services:
  # Standalone Control Plane with Embedded SQLite (Default Mode)
  # Run: docker compose up -d
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: openaudit-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BIND_ADDR=0.0.0.0:8080
      - DATA_DIR=/data
      - RUST_LOG=info
      - SECRET_KEY=${OPENAUDIT_SECRET_KEY:-openaudit-self-hosted-secret-key-32bytes-minimum}
    volumes:
      - openaudit_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # High-Availability PostgreSQL Backend (Profile: postgres)
  # Run: docker compose --profile postgres up -d
  db:
    image: postgres:16-alpine
    container_name: openaudit-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openaudit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-openaudit}
    volumes:
      - openaudit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openaudit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Control Plane linked to PostgreSQL (Profile: postgres)
  server-postgres:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: openaudit-server-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - BIND_ADDR=0.0.0.0:8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-openaudit}:${POSTGRES_PASSWORD:-openaudit_secret}@db:5432/${POSTGRES_DB:-openaudit}
      - RUST_LOG=info
      - SECRET_KEY=${OPENAUDIT_SECRET_KEY:-openaudit-self-hosted-secret-key-32bytes-minimum}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Distributed Agent Node Daemon (Profile: agent)
  # Run: docker compose --profile agent up -d
  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    container_name: openaudit-agent
    restart: unless-stopped
    profiles: ["agent"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      - SERVER_URL=http://server:8080
      - RUST_LOG=info
    volumes:
      - openaudit_agent_state:/var/lib/openaudit-agent

volumes:
  openaudit_data:
  openaudit_pgdata:
  openaudit_agent_state:
