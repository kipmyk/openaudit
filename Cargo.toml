[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine",
    "crates/network",
    "apps/server",
    "apps/cli",
    "apps/agent",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.80.0"
authors = ["OpenAudit Contributors"]
license = "Apache-2.0"
repository = "https://github.com/kipmyk/openaudit"
homepage = "https://github.com/kipmyk/openaudit"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[workspace.dependencies]
openaudit-core = { path = "crates/core" }
openaudit-engine = { path = "crates/engine" }
openaudit-network = { path = "crates/network" }
openaudit-agent = { path = "apps/agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
thiserror = "2.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
sha2 = "0.10"
hmac = "0.12"
spki = "0.7"
der = "0.7"
rsa = { version = "0.9", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3.17"
rustix = { version = "1.1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
rcgen = "0.14"
tokio = { version = "1.39", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
